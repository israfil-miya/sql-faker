<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Documentation - PostgreSQL Fake User Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.8.0/dist/mermaid.min.js"></script>
    <style>
        html {
            scroll-behavior: smooth;
        }
        :target {
            scroll-margin-top: 2rem;
        }
        .docs-container {
            max-width: 1040px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 2.5rem 3rem;
            margin-top: 1rem;
            margin-bottom: 3rem;
        }
        .docs-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 2rem;
        }
        .docs-content {
            color: var(--text-main);
            font-size: 0.95rem;
            line-height: 1.7;
        }
        .docs-content h1 { font-size: 1.8rem; margin: 1.5rem 0 1rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.4rem; scroll-margin-top: 2rem; }
        .docs-content h2 { font-size: 1.35rem; margin: 1.75rem 0 0.75rem; border-bottom: 1px solid #f1f5f9; padding-bottom: 0.3rem; scroll-margin-top: 2rem; }
        .docs-content h3 { font-size: 1.1rem; margin: 1.25rem 0 0.5rem; scroll-margin-top: 2rem; }
        .docs-content p { margin-bottom: 1rem; }
        .docs-content ul, .docs-content ol { margin: 0 0 1rem 1.5rem; }
        .docs-content li { margin-bottom: 0.35rem; }
        .docs-content table { width: 100%; border-collapse: collapse; margin: 1.25rem 0; font-size: 0.88rem; }
        .docs-content th { background: #f8fafc; border: 1px solid #e2e8f0; padding: 0.6rem 0.8rem; text-align: left; }
        .docs-content td { border: 1px solid #e2e8f0; padding: 0.55rem 0.8rem; }
        .docs-content pre { background: #0f172a; color: #f8fafc; padding: 1rem 1.25rem; border-radius: 6px; overflow-x: auto; margin: 1.25rem 0; font-family: var(--font-mono); font-size: 0.84rem; line-height: 1.5; }
        .docs-content code { font-family: var(--font-mono); background: #f1f5f9; padding: 0.15rem 0.35rem; border-radius: 4px; font-size: 0.85em; }
        .docs-content pre code { background: transparent; padding: 0; color: inherit; }
        .docs-content hr { border: 0; border-top: 1px solid #e2e8f0; margin: 2rem 0; }
        .docs-content blockquote { border-left: 4px solid #cbd5e1; padding-left: 1rem; color: #64748b; margin: 1rem 0; }
        .math-display {
            text-align: center;
            margin: 1.25rem 0;
            overflow-x: auto;
            padding: 0.5rem 0;
        }
        .mermaid {
            display: flex;
            justify-content: center;
            margin: 1.75rem 0;
            background: #ffffff;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 1.5rem;
            overflow-x: auto;
        }
    </style>
</head>
<body>

<main>
    <div class="docs-container">
        <div class="docs-header">
            <div>
                <a href="{{ url_for('index') }}" class="btn btn-secondary">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="m15 18-6-6 6-6"/>
                    </svg>
                    <span>Back to Generator</span>
                </a>
            </div>
            <div>
                <span class="data-meta-chip">PostgreSQL Stored Procedures Reference</span>
            </div>
        </div>

        <div class="docs-content" id="markdownContent"></div>
    </div>
</main>

<script type="text/plain" id="markdownSource">{{ content }}</script>

<script>
    const markdownSourceEl = document.getElementById('markdownSource');
    const rawMarkdown = markdownSourceEl ? markdownSourceEl.textContent : '';
    const target = document.getElementById('markdownContent');

    function renderDocumentation(raw) {
        if (!window.marked) {
            target.textContent = raw;
            return;
        }

        const mathItems = [];

        // 1. Extract $$ ... $$ display math
        let processed = raw.replace(/\$\$([\s\S]+?)\$\$/g, (match, math) => {
            const token = `KATEXBLOCKTOKEN${mathItems.length}END`;
            mathItems.push({ math: math.trim(), display: true, token: token });
            return token;
        });

        // 2. Extract $ ... $ inline math
        processed = processed.replace(/\$([^\$\n\r]+?)\$/g, (match, math) => {
            const token = `KATEXINLINETOKEN${mathItems.length}END`;
            mathItems.push({ math: math.trim(), display: false, token: token });
            return token;
        });

        // 3. Render markdown with marked
        let html = marked.parse(processed);

        // 4. Substitute rendered KaTeX math back in place
        mathItems.forEach(item => {
            let rendered = '';
            try {
                if (window.katex) {
                    rendered = katex.renderToString(item.math, {
                        displayMode: item.display,
                        throwOnError: false
                    });
                } else {
                    rendered = item.display ? `$$${item.math}$$` : `$${item.math}$`;
                }
            } catch (e) {
                rendered = item.display ? `$$${item.math}$$` : `$${item.math}$`;
            }

            if (item.display) {
                html = html.split(`<p>${item.token}</p>`).join(`<div class="math-display">${rendered}</div>`);
                html = html.split(item.token).join(`<div class="math-display">${rendered}</div>`);
            } else {
                html = html.split(item.token).join(rendered);
            }
        });

        target.innerHTML = html;

        // 5. Ensure all headings have IDs matching slugs if not already present
        target.querySelectorAll('h1, h2, h3, h4').forEach(h => {
            if (!h.id) {
                const slug = h.textContent.trim().toLowerCase()
                    .replace(/[^\w\s-]/g, '')
                    .replace(/\s+/g, '-');
                h.id = slug;
            }
        });

        // 6. Smooth scrolling interceptor for all in-page anchor links
        target.querySelectorAll('a[href^="#"]').forEach(link => {
            link.addEventListener('click', (e) => {
                const targetId = link.getAttribute('href').substring(1);
                const el = document.getElementById(targetId) || document.querySelector(`[name="${targetId}"]`);
                if (el) {
                    e.preventDefault();
                    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    history.pushState(null, null, '#' + targetId);
                }
            });
        });

        // 7. Check if page loaded with initial anchor hash
        if (window.location.hash) {
            const initialId = window.location.hash.substring(1);
            const initialEl = document.getElementById(initialId) || document.querySelector(`[name="${initialId}"]`);
            if (initialEl) {
                setTimeout(() => initialEl.scrollIntoView({ behavior: 'smooth', block: 'start' }), 150);
            }
        }

        // 8. Convert mermaid code blocks and run mermaid
        document.querySelectorAll('pre code.language-mermaid, pre code.lang-mermaid').forEach(el => {
            const pre = el.closest('pre');
            const div = document.createElement('div');
            div.className = 'mermaid';
            div.textContent = el.textContent.trim();
            pre.replaceWith(div);
        });

        if (window.mermaid) {
            try {
                mermaid.initialize({
                    startOnLoad: false,
                    theme: 'neutral',
                    securityLevel: 'loose'
                });
                mermaid.run({
                    nodes: document.querySelectorAll('.mermaid')
                });
            } catch (err) {
                console.warn('Mermaid rendering note:', err);
            }
        }
    }

    renderDocumentation(rawMarkdown);
</script>

</body>
</html>
