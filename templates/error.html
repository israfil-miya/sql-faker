<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error — Synthetic User Generator</title>
    <style>
        :root {
            --bg-page: #f8fafc;
            --border-subtle: #e2e8f0;
            --text-main: #0f172a;
            --text-secondary: #475569;
            --brand-dark: #0f172a;
            --brand-dark-hover: #1e293b;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: ui-monospace, Menlo, Consolas, monospace;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-sans);
            background: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card {
            background: #ffffff;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 2rem 2.5rem;
            max-width: 480px;
            width: 100%;
        }
        .tag {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #dc2626;
            background: #fef2f2;
            border: 1px solid #fecaca;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            margin-bottom: 0.75rem;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }
        p {
            font-size: 0.88rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        .actions {
            display: flex;
            gap: 0.75rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            height: 36px;
            padding: 0 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            background: var(--brand-dark);
            color: #ffffff;
            transition: background 0.15s;
        }
        .btn:hover {
            background: var(--brand-dark-hover);
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="tag">System Error</span>
        <h1>Unable to complete request</h1>
        <p>{{ message }}</p>
        <div class="actions">
            <a href="/" class="btn">&larr; Return to generator</a>
        </div>
    </div>
</body>
</html>
